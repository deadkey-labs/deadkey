name: Deadkey CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 10-Second Break-vs-Hold Demo
        run: python -m bench.demo_break_vs_hold
      - name: Environment Doctor
        run: python -m deadkey.doctor
      - name: One-Command Reproducibility Check (0-VRAM Memory + Gate + A2A)
        run: python -m bench.reproduce_all --quick
      - name: Portable CI & Security Tests
        run: |
          python tests/test_ci_portable.py
          python tests/test_semantic_critic.py
          python tests/test_mcp_and_proxy.py
          python tests/test_a2a_and_doctor.py
